<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Figure 1 de la datasheet TI LM35 : capteur de base, 2 °C à 150 °C. Fond blanc : lisible en thème sombre. -->
  <rect x="0" y="0" width="400" height="270" rx="8" fill="#ffffff"/>
  <g stroke="#000" stroke-width="2" fill="none">
    <!-- Alimentation +Vs -->
    <line x1="160" y1="45" x2="160" y2="95"/>
    <!-- Boîtier -->
    <rect x="110" y="95" width="100" height="70" fill="#f4f4f4"/>
    <!-- Sortie -->
    <line x1="210" y1="130" x2="300" y2="130"/>
    <!-- Masse -->
    <line x1="160" y1="165" x2="160" y2="205"/>
    <line x1="140" y1="205" x2="180" y2="205"/>
    <line x1="147" y1="212" x2="173" y2="212"/>
    <line x1="154" y1="219" x2="166" y2="219"/>
  </g>
  <g stroke="#000" stroke-width="2" fill="#fff">
    <circle cx="160" cy="40" r="5"/>
    <circle cx="305" cy="130" r="5"/>
  </g>
  <text x="148" y="140" text-anchor="middle" font-weight="bold" font-size="18">LM35</text>
  <g font-size="11" fill="#444">
    <text x="164" y="109">Vs</text>
    <text x="205" y="124" text-anchor="end">Vout</text>
    <text x="164" y="160">GND</text>
  </g>
  <text x="172" y="44">+Vs (4 V à 30 V)</text>
  <text x="315" y="126">Vout</text>
  <text x="240" y="155" font-size="12">0 mV + 10,0 mV/°C</text>
  <text x="200" y="255" text-anchor="middle" font-weight="bold">Capteur de base : +2 °C à +150 °C</text>
</svg>
