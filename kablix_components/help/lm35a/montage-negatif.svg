<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Figure 2 de la datasheet TI LM35 : pleine échelle, −55 °C à +150 °C. Fond blanc : lisible en thème sombre. -->
  <rect x="0" y="0" width="440" height="320" rx="8" fill="#ffffff"/>
  <g stroke="#000" stroke-width="2" fill="none">
    <!-- Alimentation +Vs -->
    <line x1="120" y1="45" x2="120" y2="95"/>
    <!-- Boîtier -->
    <rect x="70" y="95" width="100" height="70" fill="#f4f4f4"/>
    <!-- Sortie -->
    <line x1="170" y1="130" x2="300" y2="130"/>
    <!-- Masse -->
    <line x1="120" y1="165" x2="120" y2="205"/>
    <line x1="100" y1="205" x2="140" y2="205"/>
    <line x1="107" y1="212" x2="133" y2="212"/>
    <line x1="114" y1="219" x2="126" y2="219"/>
    <!-- R1 de Vout vers −Vs (symbole CEI) -->
    <line x1="240" y1="130" x2="240" y2="170"/>
    <rect x="230" y="170" width="20" height="55" fill="#fff"/>
    <line x1="240" y1="225" x2="240" y2="265"/>
  </g>
  <circle cx="240" cy="130" r="4" fill="#000"/>
  <g stroke="#000" stroke-width="2" fill="#fff">
    <circle cx="120" cy="40" r="5"/>
    <circle cx="305" cy="130" r="5"/>
    <circle cx="240" cy="270" r="5"/>
  </g>
  <text x="108" y="140" text-anchor="middle" font-weight="bold" font-size="18">LM35</text>
  <g font-size="11" fill="#444">
    <text x="124" y="109">Vs</text>
    <text x="165" y="124" text-anchor="end">Vout</text>
    <text x="124" y="160">GND</text>
  </g>
  <text x="132" y="44">+Vs (4 V à 30 V)</text>
  <text x="315" y="126">Vout</text>
  <g font-size="12">
    <text x="300" y="155">+1 500 mV à +150 °C</text>
    <text x="300" y="172">+250 mV à +25 °C</text>
    <text x="300" y="189">−550 mV à −55 °C</text>
  </g>
  <text x="258" y="196">R1</text>
  <text x="252" y="274">−Vs</text>
  <text x="258" y="240" font-size="12">R1 = −Vs / 50 µA</text>
  <text x="220" y="305" text-anchor="middle" font-weight="bold">Pleine échelle : −55 °C à +150 °C</text>
</svg>
